name: Daily QikNet voucher sync

on:
  schedule:
    # 05:30 Africa/Harare (UTC+2)
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Scan and export without uploading to QikNet"
        required: true
        default: true
        type: boolean
      branches:
        description: "Optional comma-separated QikNet branch names"
        required: false
        type: string
      confirm_live_upload:
        description: "I approve uploading exported vouchers to QikNet"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: qiknet-automation
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, windows, x64, qiknet]
    timeout-minutes: 45
    env:
      QIKNET_EMAIL: ${{ secrets.QIKNET_EMAIL }}
      QIKNET_PASSWORD: ${{ secrets.QIKNET_PASSWORD }}
      RUIJIE_EMAIL: ${{ secrets.RUIJIE_EMAIL }}
      RUIJIE_PASSWORD: ${{ secrets.RUIJIE_PASSWORD }}
      RUIJIE_API_APP_ID: ${{ secrets.RUIJIE_API_APP_ID }}
      RUIJIE_API_SECRET: ${{ secrets.RUIJIE_API_SECRET }}
      RUIJIE_API_BASE_URL: "https://cloud-eu.ruijienetworks.com"
      SMSPOP_TOKEN: ${{ secrets.SMSPOP_TOKEN }}
      STOCK_REPORT_RECIPIENT: ${{ secrets.STOCK_REPORT_RECIPIENT }}
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || toJSON(inputs.dry_run) }}
      # Scheduled runs are live; manual writes still require explicit confirmation.
      ALLOW_QIKNET_UPLOAD: ${{ github.event_name == 'schedule' && 'true' || (!inputs.dry_run && inputs.confirm_live_upload && 'true' || 'false') }}
      SYNC_BRANCHES: ${{ github.event_name == 'workflow_dispatch' && inputs.branches || '' }}
      HEADLESS: "false"

    steps:
      - name: Check out automation
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run voucher sync
        run: npm run sync

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qiknet-voucher-sync-report-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
