name: QikNet station monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      send_sms:
        description: "Send outage SMS alerts during this manual run"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: qiknet-automation
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: [self-hosted, windows, x64, qiknet]
    timeout-minutes: 20
    env:
      RUIJIE_API_APP_ID: ${{ secrets.RUIJIE_API_APP_ID }}
      RUIJIE_API_SECRET: ${{ secrets.RUIJIE_API_SECRET }}
      RUIJIE_API_BASE_URL: "https://cloud-eu.ruijienetworks.com"
      SMSPOP_TOKEN: ${{ secrets.SMSPOP_TOKEN }}
      DEFAULT_OUTAGE_RECIPIENTS: ${{ secrets.DEFAULT_OUTAGE_RECIPIENTS }}
      SPECIAL_OUTAGE_RECIPIENT: ${{ secrets.SPECIAL_OUTAGE_RECIPIENT }}
      SEND_SMS: ${{ github.event_name == 'schedule' && 'true' || toJSON(inputs.send_sms) }}
      STATION_STATE_PATH: ${{ github.workspace }}/state/station-status.json

    steps:
      - name: Check out automation
        uses: actions/checkout@v4

      - name: Restore alert state
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          New-Item -ItemType Directory -Force -Path state | Out-Null
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "X-GitHub-Api-Version" = "2022-11-28" }
          $list = Invoke-RestMethod -UseBasicParsing -Headers $headers -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=qiknet-station-state&per_page=1"
          if ($list.artifacts.Count -gt 0) {
            $zip = Join-Path $env:RUNNER_TEMP "qiknet-station-state.zip"
            Invoke-WebRequest -UseBasicParsing -Headers $headers -Uri $list.artifacts[0].archive_download_url -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath state -Force
            Remove-Item -LiteralPath $zip -Force
            Write-Output "Restored alert state from the latest GitHub artifact."
          } else {
            Write-Output "No prior alert state was found; starting with an empty state."
          }

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check station status
        run: npm run monitor

      - name: Preserve alert state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qiknet-station-state
          path: state/station-status.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload monitor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qiknet-station-monitor-${{ github.run_number }}
          path: reports/monitor/
          if-no-files-found: warn
          retention-days: 30
