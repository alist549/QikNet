name: QikNet station monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      send_sms:
        description: "Send outage SMS alerts during this manual run"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: qiknet-automation
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: [self-hosted, windows, x64, qiknet]
    timeout-minutes: 20
    env:
      RUIJIE_EMAIL: ${{ secrets.RUIJIE_EMAIL }}
      RUIJIE_PASSWORD: ${{ secrets.RUIJIE_PASSWORD }}
      SMSPOP_TOKEN: ${{ secrets.SMSPOP_TOKEN }}
      DEFAULT_OUTAGE_RECIPIENTS: ${{ secrets.DEFAULT_OUTAGE_RECIPIENTS }}
      SPECIAL_OUTAGE_RECIPIENT: ${{ secrets.SPECIAL_OUTAGE_RECIPIENT }}
      # Keep scheduled alerts disabled until recipient routing is validated.
      SEND_SMS: ${{ github.event_name == 'workflow_dispatch' && toJSON(inputs.send_sms) || 'false' }}
      HEADLESS: "false"

    steps:
      - name: Check out automation and alert state
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Check station status
        run: npm run monitor

      - name: Persist alert state
        if: always()
        shell: pwsh
        run: |
          git config user.name "qiknet-monitor[bot]"
          git config user.email "qiknet-monitor[bot]@users.noreply.github.com"
          git add state/station-status.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update station alert state"
            git push
          } else {
            Write-Output "No station-state change."
          }

      - name: Upload monitor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qiknet-station-monitor-${{ github.run_number }}
          path: reports/monitor/
          if-no-files-found: warn
          retention-days: 30
